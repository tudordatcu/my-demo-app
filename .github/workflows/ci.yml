name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2
        # Lint surfaces planted quality smells; do not block the rest of the pipeline.
        continue-on-error: true

      - name: gosec
        uses: securego/gosec@master
        with:
          args: -no-fail -fmt sarif -out gosec.sarif ./...
        # gosec intentionally reports planted SEC-* scenarios.
        continue-on-error: true

      - name: Upload gosec SARIF
        uses: actions/upload-artifact@v4
        with:
          name: gosec-sarif
          path: gosec.sarif
        if: always()

      - name: go test (race + coverage)
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic
        # The race detector intentionally trips on SEC-17; keep the job green-able for the demo.
        continue-on-error: true

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
        if: always()

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: vois-speechmark-demo:latest
